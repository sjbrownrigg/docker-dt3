# WSL2 override: bind mounts instead of NFS volumes.
#
#   docker compose -f compose.yaml -f compose.wsl.yaml up -d
#
# NFS Docker volumes are blocked here by the WSL2 mount syscall restriction --
# "operation not permitted" when the volume is mounted. Bind mounts onto an
# already-mounted share work instead. Run
# ../docker-mozarr/bootstrap/check-nfs.sh to confirm which applies.
#
# Note that ../docker-mozarr/bootstrap/mount-smb-wsl.sh mounts the library
# READ-ONLY on purpose -- mozarr only reads. discogstagger3 writes, so these
# two paths need a read-write mount. Point INCOMING_DIR and SORTED_DIR at
# writable paths, or remount those subdirectories rw.

services:
  dt3:
    volumes:
      - ${INCOMING_DIR:-/mnt/nas/music/incoming}:/incoming
      - ${SORTED_DIR:-/mnt/nas/music/sorted}:/sorted
      - ./config:/config
      - cache:/cache
